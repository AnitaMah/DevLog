name: dev_log
description: "DevLog — a personal knowledge base for programming guides, your own projects, and imported AI chats."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.3
  file_picker: ^8.1.2
  html: ^0.15.7
  syncfusion_flutter_pdf: ^35.2.12
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  msix:

flutter:
  uses-material-design: true

# Windows packaging (MSIX installer). Build with:
#   flutter pub get
#   flutter pub run msix:create
# logo_path is the app's actual icon (purple square, white "42", matching
# the in-app header logo) - also reused by the Linux/macOS packaging
# scripts under packaging/, so keep it at this shared path.
msix_config:
  display_name: DevLog
  publisher_display_name: Anita
  identity_name: com.example.dev_log
  msix_version: 1.0.0.0
  logo_path: assets\icon\app_icon_256.png
  capabilities: internetClient
  languages: en-us
  architecture: x64