name: dev_log
description: "42 Guides — a personal knowledge base for organizing programming notes by topic."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.3
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  msix:

flutter:
  uses-material-design: true

# Windows packaging (MSIX installer). Build with:
#   flutter pub get
#   flutter pub run msix:create
# logo_path currently points at the default Flutter icon extracted from
# windows/runner/resources/app_icon.ico — swap it for a real "42 Guides"
# icon whenever one exists. The same file is reused by the Linux/macOS
# packaging scripts under packaging/, so keep it at this shared path.
msix_config:
  display_name: 42 Guides
  publisher_display_name: Anita
  identity_name: com.example.dev_log
  msix_version: 1.0.0.0
  logo_path: assets\icon\app_icon_256.png
  capabilities: internetClient
  languages: en-us
  architecture: x64