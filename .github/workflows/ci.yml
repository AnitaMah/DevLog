name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - run: flutter pub get

      # --no-fatal-infos: don't fail the build over info-level lints/
      # deprecation notices (several pre-exist and aren't regressions);
      # warnings and errors still fail it.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test
