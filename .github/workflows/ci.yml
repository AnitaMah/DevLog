name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - run: flutter pub get

      # --no-fatal-infos: don't fail the build over info-level lints/
      # deprecation notices (several pre-exist and aren't regressions);
      # warnings and errors still fail it.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # Surfaces outdated deps (incl. file_picker, syncfusion_flutter_pdf,
      # html) without failing the build - informational only.
      - run: flutter pub outdated || true

      # OSV-Scanner checks pubspec.lock against the OSV vulnerability
      # database. Fails the build if a known-vulnerable version is pinned.
      - name: Dependency vulnerability scan
        uses: google/osv-scanner-action@v2.0.3
        with:
          scan-args: |-
            --lockfile=pubspec.lock
